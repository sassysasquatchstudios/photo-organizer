name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .app
        run: bash build-mac.sh

      - name: Zip .app
        run: cd dist && zip -r "Photo.Organizer.mac.zip" "Photo Organizer.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Organizer-mac
          path: dist/Photo.Organizer.mac.zip

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .exe
        run: .\build-win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Organizer-win
          path: "dist/Photo Organizer.exe"

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Photo-Organizer-mac/Photo.Organizer.mac.zip
            artifacts/Photo-Organizer-win/Photo Organizer.exe
          generate_release_notes: false
          body: |
            ## Photo Organizer ${{ github.ref_name }}

            **Mac:** Download `Photo.Organizer.mac.zip`, unzip, right-click → Open (first launch only — bypasses Gatekeeper)
            **Windows:** Download `Photo Organizer.exe` and run directly
